<div id="manual_cloud_sync_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Manual Cloud Sync">Manual Cloud Sync</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="mcs-grid">
                <label>
                    <span data-i18n="Backend">Backend</span>
                    <select id="mcs_backend" class="text_pole">
                        <option value="web_dav">WebDAV</option>
                        <option value="s3">S3</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="Endpoint">Endpoint</span>
                    <input id="mcs_endpoint" class="text_pole" type="url" autocomplete="off" />
                </label>
                <label>
                    <span data-i18n="Remote Prefix">Remote Prefix</span>
                    <input id="mcs_remote_prefix" class="text_pole" type="text" autocomplete="off" />
                </label>
                <label>
                    <span data-i18n="Device ID">Device ID</span>
                    <input id="mcs_device_id" class="text_pole" type="text" autocomplete="off" />
                </label>
            </div>

            <div id="mcs_webdav_fields" class="mcs-grid">
                <label>
                    <span data-i18n="Auth Mode">Auth Mode</span>
                    <select id="mcs_webdav_auth_mode" class="text_pole">
                        <option value="basic">Basic</option>
                        <option value="bearer">Bearer Token</option>
                    </select>
                </label>
                <label class="mcs-basic-field">
                    <span data-i18n="Username">Username</span>
                    <input id="mcs_webdav_username" class="text_pole" type="text" autocomplete="username" />
                </label>
                <label class="mcs-basic-field">
                    <span data-i18n="Password">Password</span>
                    <input id="mcs_webdav_password" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label class="mcs-bearer-field">
                    <span data-i18n="Token">Token</span>
                    <input id="mcs_webdav_token" class="text_pole" type="password" autocomplete="new-password" />
                </label>
            </div>

            <div id="mcs_s3_fields" class="mcs-grid">
                <label>
                    <span data-i18n="Bucket">Bucket</span>
                    <input id="mcs_s3_bucket" class="text_pole" type="text" autocomplete="off" />
                </label>
                <label>
                    <span data-i18n="Region">Region</span>
                    <input id="mcs_s3_region" class="text_pole" type="text" autocomplete="off" />
                </label>
                <label>
                    <span data-i18n="Access Key">Access Key</span>
                    <input id="mcs_s3_access_key" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label>
                    <span data-i18n="Secret Key">Secret Key</span>
                    <input id="mcs_s3_secret_key" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label>
                    <span data-i18n="Session Token">Session Token</span>
                    <input id="mcs_s3_session_token" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label class="checkbox_label mcs-checkbox">
                    <input id="mcs_s3_path_style" type="checkbox" />
                    <span data-i18n="Path Style">Path Style</span>
                </label>
            </div>

            <div class="flex-container flexGap5">
                <button id="mcs_save_config" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span data-i18n="Save">Save</span>
                </button>
                <button id="mcs_refresh_queue" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span data-i18n="Refresh Queue">Refresh Queue</span>
                </button>
                <button id="mcs_upload_now" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span data-i18n="Upload Now">Upload Now</span>
                </button>
                <button id="mcs_download_now" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span data-i18n="Download Oldest">Download Oldest</span>
                </button>
            </div>

            <small id="mcs_status" class="extensions_info"></small>
            <div id="mcs_queue" class="mcs-queue"></div>
        </div>
    </div>
</div>
