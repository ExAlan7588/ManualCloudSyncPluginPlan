<div id="manual_cloud_sync_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>手動雲端同步</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="inline-drawer mcs-panel" id="mcs_tts_panel">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>增量 TT-Sync</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
                    <small id="mcs_tts_status" class="extensions_info"></small>

                    <div class="mcs-grid">
                        <label>
                            <span>配對 URI</span>
                            <input id="mcs_tts_pair_uri" class="text_pole" type="text" autocomplete="off" />
                        </label>
                    </div>

                    <div class="flex-container flexGap5 mcs-toolbar">
                        <button id="mcs_tts_pair" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-link"></i>
                            <span>配對</span>
                        </button>
                        <button id="mcs_tts_refresh_servers" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span>刷新服務端</span>
                        </button>
                    </div>

                    <div class="mcs-grid">
                        <label>
                            <span>服務端</span>
                            <select id="mcs_tts_server" class="text_pole"></select>
                        </label>
                        <label>
                            <span>同步模式</span>
                            <select id="mcs_tts_mode" class="text_pole">
                                <option value="Incremental">Incremental</option>
                                <option value="Mirror">Mirror</option>
                            </select>
                        </label>
                    </div>

                    <div class="flex-container flexGap5 mcs-toolbar">
                        <button id="mcs_tts_push" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Push</span>
                        </button>
                        <button id="mcs_tts_pull" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-cloud-arrow-down"></i>
                            <span>Pull</span>
                        </button>
                        <button id="mcs_tts_unpair" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-link-slash"></i>
                            <span>解除配對</span>
                        </button>
                    </div>

                    <div class="mcs-sync-grid">
                        <section>
                            <h4>最近同步結果</h4>
                            <div id="mcs_tts_summary" class="mcs-metrics"></div>
                        </section>
                        <section>
                            <h4>傳輸進度</h4>
                            <div id="mcs_tts_progress" class="mcs-metrics"></div>
                        </section>
                        <section>
                            <h4>差異摘要</h4>
                            <div id="mcs_tts_diff" class="mcs-metrics"></div>
                        </section>
                        <section>
                            <h4>衝突列表</h4>
                            <div id="mcs_tts_conflicts" class="mcs-conflict-list"></div>
                        </section>
                    </div>

                </div>
            </div>

            <div class="inline-drawer mcs-panel" id="mcs_archive_panel">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>完整封存交棒同步</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
            <small id="mcs_mode_notice" class="extensions_info"></small>

            <div class="flex-container flexGap5 mcs-toolbar">
                <button id="mcs_use_local_webdav" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-laptop-code"></i>
                    <span>使用本機 WebDAV 開發服務</span>
                </button>
            </div>

            <div class="mcs-grid">
                <label>
                    <span>同步後端</span>
                    <select id="mcs_backend" class="text_pole">
                        <option value="web_dav">WebDAV</option>
                        <option value="s3">S3</option>
                    </select>
                </label>
                <label>
                    <span>端點 URL</span>
                    <input id="mcs_endpoint" class="text_pole" type="url" autocomplete="off" />
                </label>
            </div>

            <div id="mcs_webdav_basic_credentials" class="mcs-grid">
                <label>
                    <span>使用者名稱</span>
                    <input id="mcs_webdav_username" class="text_pole" type="text" autocomplete="username" />
                </label>
                <label>
                    <span>密碼</span>
                    <input id="mcs_webdav_password" class="text_pole" type="password" autocomplete="new-password" />
                </label>
            </div>

            <div id="mcs_s3_fields" class="mcs-grid" hidden>
                <label>
                    <span>Bucket</span>
                    <input id="mcs_s3_bucket" class="text_pole" type="text" autocomplete="off" />
                </label>
                <label>
                    <span>Region</span>
                    <input id="mcs_s3_region" class="text_pole" type="text" autocomplete="off" />
                </label>
                <label>
                    <span>Access Key</span>
                    <input id="mcs_s3_access_key" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label>
                    <span>Secret Key</span>
                    <input id="mcs_s3_secret_key" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label>
                    <span>Session Token</span>
                    <input id="mcs_s3_session_token" class="text_pole" type="password" autocomplete="new-password" />
                </label>
                <label class="checkbox_label mcs-checkbox">
                    <input id="mcs_s3_path_style" type="checkbox" />
                    <span>Path Style</span>
                </label>
            </div>

            <div class="inline-drawer mcs-advanced">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>進階設定</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
                    <div class="mcs-grid">
                        <label>
                            <span>遠端路徑前綴</span>
                            <input id="mcs_remote_prefix" class="text_pole" type="text" autocomplete="off" />
                        </label>
                        <label>
                            <span>裝置 ID</span>
                            <input id="mcs_device_id" class="text_pole" type="text" autocomplete="off" placeholder="留空時儲存後自動生成" />
                        </label>
                    </div>

                    <div id="mcs_webdav_advanced_fields" class="mcs-grid">
                        <label>
                            <span>WebDAV 驗證方式</span>
                            <select id="mcs_webdav_auth_mode" class="text_pole">
                                <option value="basic">Basic 帳密</option>
                                <option value="bearer">Bearer Token</option>
                            </select>
                        </label>
                        <label class="mcs-bearer-field" hidden>
                            <span>Bearer Token</span>
                            <input id="mcs_webdav_token" class="text_pole" type="password" autocomplete="new-password" />
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex-container flexGap5">
                <button id="mcs_save_config" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>儲存</span>
                </button>
                <button id="mcs_refresh_queue" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>重新整理佇列</span>
                </button>
                <button id="mcs_upload_now" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>立即上傳</span>
                </button>
                <button id="mcs_download_now" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>下載最舊項目</span>
                </button>
            </div>

            <div id="mcs_compat_actions" class="flex-container flexGap5 mcs-compat-actions" hidden>
                <button id="mcs_export_archive" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-file-export"></i>
                    <span>匯出到檔案</span>
                </button>
                <button id="mcs_select_archive_upload" class="menu_button menu_button_icon" type="button">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span>選擇 zip 上傳</span>
                </button>
                <input id="mcs_upload_archive_input" type="file" accept=".zip,application/zip" hidden />
            </div>

            <small id="mcs_status" class="extensions_info"></small>
            <div id="mcs_queue" class="mcs-queue"></div>
                </div>
            </div>
        </div>
    </div>
</div>
